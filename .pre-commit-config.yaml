repos:
  - repo: local
    hooks:
      - id: version-sync
        name: version-sync
        entry: python3 scripts/version_sync.py --check
        language: system
        always_run: true
        pass_filenames: false
      - id: index-build
        name: index-build
        entry: python3 scripts/index_build.py --check
        language: system
        always_run: true
        pass_filenames: false
      - id: pylint
        name: pylint
        entry: pylint
        language: python
        types: [python]
        additional_dependencies: ['pylint>=3.0']
        args:
          - --rcfile=/dev/null
          - --disable=C,R,W0611,W0613
          - --fail-under=9.5
