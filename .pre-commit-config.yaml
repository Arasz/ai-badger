repos:
  - repo: local
    hooks:
      - id: version-sync
        name: version-sync
        entry: python3 tooling/version_sync.py --check
        language: system
        always_run: true
        pass_filenames: false
      - id: index-build
        name: index-build
        entry: python3 tooling/index_build.py --check
        language: system
        always_run: true
        pass_filenames: false
      - id: changelog-index
        name: changelog-index
        entry: python3 tooling/changelog_index.py --check
        language: system
        always_run: true
        pass_filenames: false
      - id: plugin-skills-sync
        name: plugin-skills-sync
        entry: python3 tooling/sync_plugin_skills.py --check
        language: system
        always_run: true
        pass_filenames: false
      - id: docs-guard
        name: docs-guard
        entry: python3 gates/docs_guard.py
        language: system
        always_run: true
        pass_filenames: false
      - id: deps-guard
        name: deps-guard
        entry: python3 gates/deps_guard.py
        language: system
        always_run: true
        pass_filenames: false
      - id: shipped-paths-guard
        name: shipped-paths-guard
        entry: python3 gates/shipped_paths_guard.py
        language: system
        always_run: true
        pass_filenames: false
      - id: scaffold-freshness-guard
        name: scaffold-freshness-guard
        entry: python3 gates/scaffold_freshness_guard.py
        language: system
        always_run: true
        pass_filenames: false
      - id: pylint
        name: pylint
        entry: pylint
        language: python
        types: [python]
        additional_dependencies: ['pylint>=3.0']
        args:
          # E0401 matches pyproject.toml's repo-wide disable: scripts resolve badger_lib
          # via sys.path, and this hook's isolated venv has no pytest, so every import in
          # a test file reports unresolvable. --rcfile=/dev/null re-enabled it here only.
          - --rcfile=/dev/null
          - --disable=C,R,W0611,W0613,E0401
          - --fail-under=9.5
