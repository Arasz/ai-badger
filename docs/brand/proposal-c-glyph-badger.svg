<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="ai-badger logo: a flat geometric badger head with a neural chain down the blaze">
  <title>ai-badger — Glyph Badger</title>

  <rect width="256" height="256" rx="56" fill="#F2F5FA"/>
  <rect x="1.5" y="1.5" width="253" height="253" rx="54.5" fill="none" stroke="#1B1F2A" stroke-opacity=".12" stroke-width="3"/>

  <!-- ears -->
  <circle cx="60" cy="56" r="25" fill="#1B1F2A"/>
  <circle cx="196" cy="56" r="25" fill="#1B1F2A"/>
  <circle cx="52" cy="48" r="9" fill="#5A6BFF"/>
  <circle cx="204" cy="48" r="9" fill="#5A6BFF"/>

  <!-- head -->
  <path d="M128 40c47 0 86 30 86 74 0 48-38 100-86 100s-86-52-86-100c0-44 39-74 86-74z" fill="#1B1F2A"/>

  <!-- blaze -->
  <path d="M106 44h44l7 102a29 29 0 0 1-58 0z" fill="#F2F5FA"/>

  <!-- neural chain down the blaze -->
  <g stroke="#5A6BFF" stroke-width="6" stroke-linecap="round">
    <path d="M128 70v16M128 100v16"/>
  </g>
  <g fill="#5A6BFF">
    <circle cx="128" cy="62" r="8"/>
    <circle cx="128" cy="93" r="8"/>
    <circle cx="128" cy="124" r="8"/>
  </g>

  <!-- eyes -->
  <circle cx="82" cy="120" r="14" fill="#F2F5FA"/>
  <circle cx="174" cy="120" r="14" fill="#F2F5FA"/>
  <circle cx="82" cy="120" r="6.5" fill="#1B1F2A"/>
  <circle cx="174" cy="120" r="6.5" fill="#1B1F2A"/>

  <!-- nose -->
  <path d="M114 141h28q5 0 5 5 0 12-19 20-19-8-19-20 0-5 5-5z" fill="#1B1F2A"/>
</svg>
