<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="ai-badger logo: a badger peeking over the top of a terminal window">
  <title>ai-badger — Terminal Badger</title>

  <defs>
    <clipPath id="b-head">
      <path d="M128 46c42 0 74 22 82 58 7 33-10 60-34 78-14 11-28 24-48 24s-34-13-48-24c-24-18-41-45-34-78 8-36 40-58 82-58z"/>
    </clipPath>
    <linearGradient id="b-field" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A1712"/>
      <stop offset="1" stop-color="#0C0D10"/>
    </linearGradient>
    <linearGradient id="b-fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D9DEE6"/>
    </linearGradient>
  </defs>

  <rect width="256" height="256" rx="56" fill="url(#b-field)"/>
  <rect x="1.5" y="1.5" width="253" height="253" rx="54.5" fill="none" stroke="#FFB454" stroke-opacity=".3" stroke-width="3"/>

  <!-- the badger, peeking over the terminal -->
  <g transform="translate(43.5,-2) scale(0.66)">
    <g stroke="#0C0D10" stroke-width="5">
      <circle cx="58" cy="60" r="27" fill="#E4EBF3"/>
      <circle cx="198" cy="60" r="27" fill="#E4EBF3"/>
      <circle cx="58" cy="62" r="13" fill="#241E16" stroke="none"/>
      <circle cx="198" cy="62" r="13" fill="#241E16" stroke="none"/>
      <circle cx="58" cy="62" r="5" fill="#FFB454" stroke="none"/>
      <circle cx="198" cy="62" r="5" fill="#FFB454" stroke="none"/>
    </g>

    <path d="M128 46c42 0 74 22 82 58 7 33-10 60-34 78-14 11-28 24-48 24s-34-13-48-24c-24-18-41-45-34-78 8-36 40-58 82-58z" fill="url(#b-fur)"/>

    <g clip-path="url(#b-head)" fill="#1D1913">
      <path d="M78 44c-5 44 1 88 24 130l22-8c-15-35-15-82 2-122z"/>
      <path d="M178 44c5 44-1 88-24 130l-22-8c15-35 15-82-2-122z"/>
    </g>

    <g>
      <circle cx="97" cy="120" r="14" fill="#0C0D10"/>
      <circle cx="159" cy="120" r="14" fill="#0C0D10"/>
      <circle cx="97" cy="120" r="10" fill="#FFB454"/>
      <circle cx="159" cy="120" r="10" fill="#FFB454"/>
      <circle cx="97" cy="120" r="4.8" fill="#2A1B06"/>
      <circle cx="159" cy="120" r="4.8" fill="#2A1B06"/>
      <circle cx="101" cy="115.5" r="3.4" fill="#FFFFFF"/>
      <circle cx="163" cy="115.5" r="3.4" fill="#FFFFFF"/>
    </g>

    <ellipse cx="128" cy="176" rx="33" ry="25" fill="#F7FAFC"/>
    <path d="M117 158h22q4 0 4 4 0 10-15 16-15-6-15-16 0-4 4-4z" fill="#1D1913"/>
    <g fill="none" stroke="#1D1913" stroke-width="4.2" stroke-linecap="round">
      <path d="M128 178v6"/>
      <path d="M128 184q-8 8-15 1"/>
      <path d="M128 184q8 8 15 1"/>
    </g>
  </g>

  <!-- terminal window -->
  <g>
    <rect x="16" y="122" width="224" height="118" rx="18" fill="#131721"/>
    <path d="M16 140h224v-.5c0-9.9-8.1-18-18-18H34c-9.9 0-18 8.1-18 18z" fill="#202734"/>
    <rect x="16" y="122" width="224" height="118" rx="18" fill="none" stroke="#FFB454" stroke-opacity=".22" stroke-width="2.5"/>
    <!-- prompt -->
    <path d="M38 163l16 12-16 12" fill="none" stroke="#FFB454" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="66" y="161" width="13" height="28" rx="3" fill="#FFB454"/>
    <g fill="#FFFFFF" fill-opacity=".22">
      <rect x="38" y="206" width="112" height="11" rx="5.5"/>
      <rect x="160" y="206" width="46" height="11" rx="5.5"/>
    </g>
  </g>

  <!-- paws hooked over the window edge -->
  <g fill="#E4EBF3" stroke="#0C0D10" stroke-width="4.5" stroke-linejoin="round">
    <path d="M40 114h40a7 7 0 0 1 7 7v20a7 7 0 0 1-7 7H40a7 7 0 0 1-7-7v-20a7 7 0 0 1 7-7z"/>
    <path d="M176 114h40a7 7 0 0 1 7 7v20a7 7 0 0 1-7 7h-40a7 7 0 0 1-7-7v-20a7 7 0 0 1 7-7z"/>
  </g>
  <g fill="none" stroke="#0C0D10" stroke-width="3.5" stroke-linecap="round" stroke-opacity=".5">
    <path d="M53 126v16M67 126v16"/>
    <path d="M189 126v16M203 126v16"/>
  </g>
</svg>
