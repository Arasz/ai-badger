# Secret scanning (gitleaks) — Wave 18, WP55/WP56.
#
# Why gitleaks and not an extension of `scripts/unsafe_literals.py`:
#   `unsafe_literals` is a *boundary* guard. It holds five high-confidence patterns and refuses
#   to move content across a boundary (feed-badger's outbound PR, the inbound Hermes sync). It
#   is stdlib-only and offline on purpose, because it runs in a user's repository.
#   This job is a *history* scan, which is a different door: it asks whether a credential was
#   ever committed, including in a commit later "fixed" by a follow-up commit — history keeps
#   the blob, and pushing it published it. Re-implementing that in `unsafe_literals` would mean
#   hand-rolling git-history traversal behind a five-rule detector, which is worse coverage
#   dressed up as fewer dependencies. CI can afford a third-party Action; pre-commit cannot.
#   The two are kept separate deliberately: neither replaces the other.
#
# Not covered by CodeQL: `.github/workflows/codeql.yml` analyses Python *source* for
# vulnerability patterns. It does not read commit history and does not scan non-Python files,
# which is where committed credentials actually live (config, fixtures, notes).
#
# Baseline: none, and no `.gitleaksignore`. Scanned before this file was added, with gitleaks
# 8.30.1: 307 commits reachable from every ref, plus the working tree — zero findings. The
# "new findings only" baseline WP55 provisioned for was therefore unnecessary and WP56's
# backlog is empty, so the gate blocks from its first run. A permanently-baselined scanner is
# theatre; if a future finding is a genuine false positive, add that one fingerprint to a
# `.gitleaksignore` rather than reintroducing a whole-repo baseline.
name: Secret scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Weekly, off-peak (Wednesday 03:41 UTC), offset from CodeQL's 03:17 so the two do not
    # queue against each other.
    - cron: '41 3 * * 3'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # The scan resolves a commit range (pull_request, push) or walks the whole history
          # (schedule, workflow_dispatch). The default fetch-depth: 1 has neither, and the
          # scan would pass by finding nothing to read.
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The action redacts every finding before it reaches the log or the summary, which
          # matters more here than elsewhere: this repository is public, so an unredacted
          # finding would publish the credential it just caught. The artifact is switched off
          # for the same reason — a redacted finding in the log is enough to act on, and a
          # downloadable report is one more copy of a scan result for no triage gain.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
          # PR review comments are off so the job can keep `contents: read`. Posting them
          # needs `pull-requests: write`, and widening a token held by a step that downloads
          # a binary buys a convenience the job summary already provides.
          GITLEAKS_ENABLE_COMMENTS: false
          # The gitleaks binary version is deliberately left at the action's default (latest).
          # A detector is the one dependency where staleness is the larger risk: a pinned
          # version freezes the rule set, and new rules are the whole value. The job holds
          # `contents: read` and no secret worth exfiltrating, so the usual argument for
          # pinning a downloaded binary is weak here.
