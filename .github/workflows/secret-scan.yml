# Secret scanning for this repository's git history.
#
# Distinct from `engine/unsafe_literals.py`, an offline boundary guard with five
# high-confidence patterns: this asks whether a credential was ever committed, which needs
# history traversal and a real rule set. Distinct from CodeQL, which reads Python source only
# and never reads history.
#
# No baseline and no `.gitleaksignore`: a full-history scan before this file was added found
# nothing, so nothing is suppressed. The `gitleaks` context is a required status check on the
# default-branch ruleset since 0.91.0 — before that the job could be red and a PR still merged,
# which is how #325 landed (review finding A6).
name: Secret scan

on:
  # `push: '**'` plus `pull_request` ran this twice for every PR branch. `pull_request` is the
  # trigger the required check is evaluated on, and the only one that reaches a fork, so it is
  # the one kept; `push` narrows to main so a merge is still scanned. The gap this leaves — a
  # branch pushed and never opened as a PR — is the deliberate trade.
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Weekly, off-peak (Wednesday 03:41 UTC), offset from CodeQL's 03:17.
    - cron: '41 3 * * 3'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # The scan resolves a commit range or walks the whole history; the default
          # fetch-depth: 1 has neither, and the scan would pass by finding nothing to read.
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # This repository is public, so an uploaded report is one more copy of a scan
          # result, and PR comments would need `pull-requests: write` on a step that
          # downloads a binary. The redacted job summary is enough to act on.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
          GITLEAKS_ENABLE_COMMENTS: false
