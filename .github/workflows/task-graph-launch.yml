name: task-graph launch

on: push

# Least privilege: every step here reads the checkout and writes nothing back.
permissions:
  contents: read

jobs:
  # The task-graph MCP launch is the one cross-OS contract the Linux jobs in pylint.yml
  # cannot exercise: it runs `uv` and Python path handling on Windows, where the previous
  # `sh`/`git` launch did not exist. Only the launch probe runs here.
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Python 3.10
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.10'
    - name: Set up uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        enable-cache: false
    - name: Install dependencies
      run: python -m pip install -r engine/requirements-dev.txt
    - name: Run the launch probe
      run: python -m pytest --noconftest -q tests/test_task_graph_launch.py
