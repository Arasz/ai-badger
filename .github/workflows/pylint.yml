name: Lint and test

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10"]
    steps:
    - uses: actions/checkout@v7
      with:
        # release_guard.py needs tags to find the last ai-badger--v* release; the default
        # fetch-depth: 1 does not fetch them, which would make the guard silently pass.
        fetch-depth: 0
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pylint pytest jsonschema pyyaml
    - name: Analysing the code with pylint (scripts only; tests keep their own conventions)
      run: |
        pylint -j 0 $(git ls-files '*.py' | grep -v '^tests/')
    - name: Run tests with pytest
      run: |
        pytest -q
    - name: index.json is up to date
      run: |
        python3 tooling/index_build.py --check
    - name: docs/changelog/README.md's table matches the entry files
      run: |
        python3 tooling/changelog_index.py --check
    - name: Shipped .claude/skills/ copy matches features/
      run: |
        python3 tooling/sync_plugin_skills.py --check
    - name: Framework tree validates against its schemas
      run: |
        python3 tooling/validate.py --all
    - name: Agent instruction files match the model
      if: matrix.python-version == '3.10'
      run: |
        node features/common/skills/maintain-agent-instructions/scripts/validate-agent-instructions.mjs
        node features/common/skills/maintain-agent-instructions/scripts/check-agent-drift.mjs
    - name: Version literals (plugin.json, marketplace.json, index.json) agree with VERSION
      run: |
        python3 tooling/version_sync.py --check
    - name: Docs guard - links, repo paths and the changelog index still resolve
      run: |
        python3 gates/docs_guard.py
    - name: Release guard - shipped surface change requires a VERSION bump
      run: |
        python3 gates/release_guard.py
    - name: Shipped-paths guard - no machine-specific absolute path in a tracked file
      run: |
        python3 gates/shipped_paths_guard.py
    - name: Scaffold-freshness guard - re-scaffolding this repo changes nothing but stamps
      run: |
        python3 gates/scaffold_freshness_guard.py
    - name: Dependency guard - every third-party import is declared in engine/requirements.txt
      run: |
        python3 gates/deps_guard.py
    - name: JS gate scripts have tests
      if: matrix.python-version == '3.10'
      run: |
        node --test "tests/js/*.test.mjs"
    - name: TDD guard - code change requires a test change
      if: matrix.python-version == '3.10' && github.ref != 'refs/heads/main'
      run: |
        # checkout's fetch-depth: 0 does not guarantee a remote-tracking ref for main.
        # A failed fetch is not silently tolerated: the guard then reports COULD NOT RUN.
        git fetch --no-tags origin main:refs/remotes/origin/main || true
        python3 gates/tdd_guard.py --base origin/main
