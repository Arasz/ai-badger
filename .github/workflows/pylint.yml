name: Lint and test

on: [push]

# Least privilege: every step here reads the checkout and writes nothing back.
permissions:
  contents: read

jobs:
  # Three independent jobs so one push shows every failure as its own red X, instead of one
  # job that aborts at its first failing step. Each job invokes `.lefthook/pre-push/verify.sh`
  # — the same gate a developer's pre-push hook runs — so the set of checks lives in exactly
  # one place: $LANES in that script. Nothing here re-lists lane names or their commands.
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10"]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # release_guard.py needs tags to find the last ai-badger--v* release; the default
        # fetch-depth: 1 does not fetch them, which would make the guard silently pass.
        # (This job only runs pytest, but every job here shares the same checkout step.)
        fetch-depth: 0
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pylint pytest jsonschema pyyaml
    - name: verify.sh pytest
      run: bash .lefthook/pre-push/verify.sh pytest

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10"]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pylint pytest jsonschema pyyaml
    - name: verify.sh pylint
      run: bash .lefthook/pre-push/verify.sh pylint

  # Every lane except pytest and pylint (each has its own matrixed job above) and journey
  # (covered by consumer-journey.yml on its own push trigger — running it here too would
  # verify the same thing twice). 3.10 only, matching what pylint.yml ran the .mjs agent-
  # instruction validators and the js lane on before this restructure.
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
    - name: Set up Python 3.10
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pylint pytest jsonschema pyyaml
    - name: Run every remaining lane, reporting every failure in this one job
      run: |
        # tdd_guard compares against main; checkout's fetch-depth: 0 does not guarantee a
        # remote-tracking ref for it. A failed fetch is not silently tolerated: the guard
        # then reports COULD NOT RUN.
        git fetch --no-tags origin main:refs/remotes/origin/main || true

        all_lanes="$(sed -n 's/^readonly LANES="\(.*\)"$/\1/p' .lefthook/pre-push/verify.sh)"
        if [ -z "$all_lanes" ]; then
          echo "could not read LANES from .lefthook/pre-push/verify.sh" >&2
          exit 1
        fi

        rc=0
        failed=""
        for lane in $all_lanes; do
          case "$lane" in
            pytest|pylint) continue ;;   # own jobs above
            journey) continue ;;         # consumer-journey.yml already runs this on push
            tdd)
              # Mirrors the guard's own main-branch exemption: a push straight to main has
              # no PR to demand a paired test change against.
              if [ "${GITHUB_REF:-}" = "refs/heads/main" ]; then
                echo "-- tdd: skipped (push to main)"
                continue
              fi
              ;;
          esac
          echo "::group::verify $lane"
          if ! bash .lefthook/pre-push/verify.sh "$lane"; then
            rc=1
            failed="$failed $lane"
          fi
          echo "::endgroup::"
        done

        if [ -n "$failed" ]; then
          echo "FAILED lanes:$failed" >&2
        fi
        exit "$rc"
